<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARVESTERKEN</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="images/favilog.jpeg">
</head>

<body>

<header>
<img src="images/hav-logo-new.jpg" class="logo">
<button class="mode-toggle">🌗</button>
</header>

<div class="split">

<a href="home.html" class="panel cleaning">
<img src="images/clean.png">
<div class="overlay">
<h2>CLEANING</h2>
<p>Elite Maintenance</p>
<span>Enter Cleaning Hub →</span>
</div>
</a>

<a href="solar.html" class="panel solar">
<img src="images/solar.png">
<div class="overlay">
<h2>SOLAR</h2>
<p>Future Energy</p>
<span>Enter Solar Tech →</span>
</div>
</a>

</div>

<!-- ========================================================= -->
<!-- HARVESTERKEN LUXURY SEASONAL GREETING OVERLAY             -->
<!-- ========================================================= -->
<div class="season-ambient-particles" aria-hidden="true"></div>

<aside class="season-widget" id="seasonWidget" aria-label="Seasonal Greetings">
  <!-- Minimized State Pill (Hidden by default) -->
  <button class="season-pill" id="seasonExpandBtn" title="Open Season's Greetings">
    <svg class="mini-star" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="url(#goldGradMini)"/>
      <defs>
        <linearGradient id="goldGradMini" x1="2" y1="2" x2="22" y2="22">
          <stop offset="0%" stop-color="#FDE047"/>
          <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
      </defs>
    </svg>
    <span>Season’s Greetings</span>
  </button>

  <!-- Expanded Luxury Card -->
  <div class="season-card">
    <div class="season-shimmer"></div>
    <button class="season-close" id="seasonMinimizeBtn" aria-label="Minimize greeting">✕</button>
    
    <!-- Custom Brand-Synced SVG: Solar-Sparkle North Star & Wreath -->
    <div class="season-emblem">
      <svg viewBox="0 0 100 100" class="emblem-svg">
        <defs>
          <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FEF08A"/>
            <stop offset="50%" stop-color="#FACC15"/>
            <stop offset="100%" stop-color="#CA8A04"/>
          </linearGradient>
          <linearGradient id="cyanFrost" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#E0F2FE"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Outer Rotating Orbital Ring -->
        <circle cx="50" cy="50" r="42" fill="none" stroke="url(#champagneGold)" stroke-width="1" stroke-dasharray="4 6" class="spin-slow"/>
        <circle cx="50" cy="50" r="35" fill="none" stroke="url(#cyanFrost)" stroke-width="0.8" opacity="0.6"/>

        <!-- Geometric Botanical / Sunburst Rays -->
        <g class="pulse-rays" stroke="url(#champagneGold)" stroke-width="1.5" stroke-linecap="round">
          <line x1="50" y1="6" x2="50" y2="16"/>
          <line x1="50" y1="84" x2="50" y2="94"/>
          <line x1="6" y1="50" x2="16" y2="50"/>
          <line x1="84" y1="50" x2="94" y2="50"/>
          <line x1="19" y1="19" x2="26" y2="26"/>
          <line x1="74" y1="74" x2="81" y2="81"/>
          <line x1="81" y1="19" x2="74" y2="26"/>
          <line x1="26" y1="74" x2="19" y2="81"/>
        </g>

        <!-- Central 8-Pointed Harvesterken Star -->
        <path d="M50 18 L56 44 L82 50 L56 56 L50 82 L44 56 L18 50 L44 44 Z" fill="url(#champagneGold)" filter="url(#glow)"/>
        <path d="M50 30 L53 47 L70 50 L53 53 L50 70 L47 53 L30 50 L47 47 Z" fill="#FFFFFF" opacity="0.85"/>
      </svg>
    </div>

    <div class="season-text">
      <span class="season-tag">HARVESTERKEN HOLIDAY EDITION</span>
      <h3>Brilliant Spaces. Radiant Holidays.</h3>
      <p>Wishing you Happy Christmas &amp; a bright, energy-filled New Year.</p>
    </div>
  </div>
</aside>

<script src="js/app.js"></script>
</body>
</html>
